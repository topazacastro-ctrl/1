
name: 🏗️ Build APK - Topaza Campo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: 📦 Instalar dependências
        run: flutter pub get

      - name: 🔎 Análise de código
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🏗️ Build APK
        run: flutter build apk --release --no-shrink

      - name: 📝 Renomear APK
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          DATE=$(date +'%Y%m%d')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/topaza_campo_v${VERSION}_${DATE}.apk
          echo "APK_NAME=topaza_campo_v${VERSION}_${DATE}.apk" >> $GITHUB_ENV

      - name: 📤 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/app/outputs/flutter-apk/topaza_campo_v*.apk
          retention-days: 30
